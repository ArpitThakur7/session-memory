<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<meta name="color-scheme" content="light dark">
<title>Memory map</title>
<style>
:root {
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
  --bg: #f5f4ef;
  --bg-edge: #e6e4dc;
  --panel: rgba(255, 255, 255, 0.80);
  --panel-solid: #ffffff;
  --border: rgba(31, 30, 28, 0.10);
  --border-strong: rgba(31, 30, 28, 0.18);
  --ink: #1f1e1c;
  --ink-2: #4d4b46;
  --muted: #86837b;
  --hover: rgba(31, 30, 28, 0.055);
  --press: rgba(31, 30, 28, 0.09);
  --field: rgba(31, 30, 28, 0.045);
  --accent: #6c63d4;
  --tip-bg: rgba(31, 30, 28, 0.92);
  --tip-ink: #f7f6f2;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 28px rgba(31, 30, 28, 0.10);
  --edge-rgb: 72, 70, 64;
  --star-rgb: 90, 88, 80;
  --star-alpha: 0.22;
  --inset-l: 0px;
  --inset-r: 0px;
  --inset-b: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15161a;
    --bg-edge: #0a0b0d;
    --panel: rgba(26, 27, 31, 0.78);
    --panel-solid: #1c1d21;
    --border: rgba(255, 255, 255, 0.075);
    --border-strong: rgba(255, 255, 255, 0.14);
    --ink: #ecebe6;
    --ink-2: #bdbbb3;
    --muted: #84827b;
    --hover: rgba(255, 255, 255, 0.06);
    --press: rgba(255, 255, 255, 0.10);
    --field: rgba(255, 255, 255, 0.055);
    --accent: #9a93ee;
    --tip-bg: rgba(246, 245, 240, 0.95);
    --tip-ink: #1f1e1c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 36px rgba(0, 0, 0, 0.45);
    --edge-rgb: 214, 211, 200;
    --star-rgb: 220, 218, 210;
    --star-alpha: 0.55;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: radial-gradient(120% 90% at 55% 42%, var(--bg) 0%, var(--bg) 35%, var(--bg-edge) 100%);
  color: var(--ink);
  font: 13px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
svg { display: block; }

#stage { position: fixed; inset: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#map.pointer { cursor: pointer; }
#map.grabbing { cursor: grabbing; }

.panel {
  background: var(--panel);
  -webkit-backdrop-filter: blur(20px) saturate(1.3);
  backdrop-filter: blur(20px) saturate(1.3);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
}
.icon-btn {
  width: 30px; height: 30px; flex: none; display: grid; place-items: center;
  border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); cursor: pointer;
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { background: var(--press); }
.btn {
  height: 30px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--border-strong);
  background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 500; white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--hover); }
.btn:active { background: var(--press); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- sidebar ---------- */
#sidebar {
  position: fixed; top: 12px; left: 12px; bottom: 12px; width: 304px; z-index: 4;
  display: flex; flex-direction: column; overflow: hidden;
  transition: transform .32s cubic-bezier(.2, .8, .2, 1), opacity .22s ease;
}
body.side-closed #sidebar { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }
#sideOpen {
  position: fixed; top: 14px; left: 14px; z-index: 3; width: 38px; height: 38px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
body.side-closed #sideOpen { opacity: 1; pointer-events: auto; }
.side-head { display: flex; align-items: flex-start; gap: 11px; padding: 16px 12px 12px 16px; }
.logo {
  width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(140deg, #8f88e6, #5b52c4); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 4px 12px rgba(108, 99, 212, .35);
}
.grow { flex: 1; min-width: 0; }
.proj-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.search-wrap { position: relative; margin: 0 12px 6px; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#search {
  width: 100%; height: 36px; padding: 0 34px 0 32px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--field); color: var(--ink); font: inherit; font-size: 13px;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
#search::placeholder { color: var(--muted); }
#search:focus { outline: none; border-color: var(--accent); background: var(--panel-solid); box-shadow: 0 0 0 3px rgba(127, 119, 221, .18); }
#search::-webkit-search-cancel-button { display: none; }
.search-wrap kbd {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border-strong); border-radius: 5px; padding: 0 5px;
}
#searchClear { position: absolute; right: 4px; top: 3px; display: none; }
#sidebar.searching .search-wrap kbd { display: none; }
#sidebar.searching #searchClear { display: grid; }
#searchInfo { margin: 2px 16px 0; min-height: 0; }
.side-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 12px; overscroll-behavior: contain; scrollbar-width: thin; }
#sidebar.searching .side-scroll > section { display: none; }
#sidebar:not(.searching) #results { display: none; }
.section { margin-top: 14px; }
.section > h2 {
  margin: 0 8px 7px; font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.section > h2 .n { font-weight: 500; letter-spacing: 0; }
.range { display: flex; gap: 2px; padding: 3px; margin: 0 12px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--field); }
.range button {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  min-height: 38px; padding: 3px 2px; border: 0; border-radius: 7px; background: transparent; cursor: pointer;
  font-size: 11.5px; line-height: 1.2; color: var(--ink-2); transition: background .15s, color .15s;
}
.range button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.range button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.range button .n { font-size: 10px; color: inherit; opacity: .75; font-variant-numeric: tabular-nums; }
.range-label { margin: 2px 14px 5px; font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#rangeEmpty {
  position: fixed; inset: 0; z-index: 1; display: none; place-items: center; padding: 24px; text-align: center;
  pointer-events: none; font-size: 15px; color: var(--ink-2);
}
body.range-empty #rangeEmpty { display: grid; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 6px; }
.chip {
  --c: #888780;
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 9px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--field); cursor: pointer; font-size: 12px;
  transition: opacity .15s, background .15s, border-color .15s;
}
.chip:hover { border-color: var(--border-strong); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: .5; }
.chip[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.chip[aria-pressed="false"] .lbl { text-decoration: line-through; text-decoration-color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 1px; }
.row {
  display: flex; align-items: center; gap: 9px; width: 100%; min-height: 34px; padding: 6px 8px;
  border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer; transition: background .12s;
}
.row:hover { background: var(--hover); }
.row:active { background: var(--press); }
.row .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.row .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .two { flex: 1; min-width: 0; }
.row .two .txt { display: block; }
.row .meta { color: var(--muted); font-size: 11px; flex: none; font-variant-numeric: tabular-nums; }
.row .two .meta { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.current { background: var(--hover); }
.brief-block { margin: 0 8px 12px; }
.brief-block .k { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden; white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }
.clamp.full { display: block; -webkit-line-clamp: unset; }
.more { border: 0; background: none; padding: 2px 0; color: var(--accent); cursor: pointer; font-size: 11.5px; font-weight: 550; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.steps li { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); }
.steps .st { flex: none; margin-top: 3px; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; }
.steps .st.in_progress { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 3px, transparent 3.5px); }
.steps .st.completed { border-color: #1D9E75; background: #1D9E75; }
.steps .st.completed::after { content: ""; width: 5px; height: 3px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: translateY(-1px) rotate(-45deg); }
.steps li.done span.t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.side-foot { display: flex; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid var(--border); }
.side-foot .btn { flex: 1; }
.empty-note { color: var(--muted); padding: 4px 8px; font-size: 12px; }
.sec-toggle {
  display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; cursor: pointer;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
}
.sec-toggle .chev { width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
.sec-toggle[aria-expanded="false"] .chev { transform: rotate(-45deg); }
#tokBody[hidden] { display: none; }
.tok { margin: 0 8px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums; }
.tok .k { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
.tok-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tok-stat { padding: 7px 9px; border-radius: 9px; background: var(--field); min-width: 0; }
.tok-stat .v { font-size: 15px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tok-stat .l { font-size: 10.5px; color: var(--muted); }
.tok-bars { display: flex; align-items: stretch; gap: 3px; height: 72px; }
.tok-bar { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column-reverse; border-radius: 3px; overflow: hidden; }
.tok-bar:hover { background: var(--hover); }
.tok-seg { flex: none; width: 100%; }
.tok-new { background: #D85A30; }
.tok-cached { background: #1D9E75; }
.tok-out { background: var(--accent); }
.tok-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.tok-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--ink-2); margin-top: 5px; }
.tok-legend span { display: inline-flex; align-items: center; gap: 5px; }
.tok-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tok-split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--field); margin-bottom: 4px; }
.tok-line { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; color: var(--ink-2); }
.tok-line .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tok-line .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tok-line .meta { color: var(--muted); font-size: 11px; flex: none; }
.tok-note { font-size: 10.5px; color: var(--muted); line-height: 1.4; }

/* ---------- details ---------- */
#details {
  position: fixed; top: 12px; right: 12px; width: 348px; max-height: calc(100% - 24px); z-index: 4;
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none;
  transition: transform .32s cubic-bezier(.2, .8, .2, 1), opacity .2s ease;
}
#details.open { transform: none; opacity: 1; pointer-events: auto; }
.det-head { display: flex; align-items: center; gap: 8px; padding: 12px 10px 4px 16px; }
.kind-pill {
  --c: #888780;
  display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px 0 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--ink); font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
}
.kind-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.det-body { overflow-y: auto; padding: 6px 16px 16px; overscroll-behavior: contain; scrollbar-width: thin; }
.det-label {
  font-size: 14px; line-height: 1.5; font-weight: 550; white-space: pre-wrap; word-break: break-word;
  user-select: text; -webkit-user-select: text; max-height: 260px; overflow-y: auto; margin: 4px 0 12px;
}
.det-label.code { font: 12.5px/1.55 var(--mono); font-weight: 450; background: var(--field); border-radius: 8px; padding: 8px 10px; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 14px; font-size: 12px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.det-actions { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.conn h3 { margin: 12px 0 4px; font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.conn .row { min-height: 30px; padding: 5px 8px; margin: 0 -8px; width: calc(100% + 16px); }

/* ---------- toolbar / hint / tooltip / toast ---------- */
.toolbar {
  position: fixed; z-index: 3; left: calc(var(--inset-l) + 16px); bottom: calc(var(--inset-b) + 16px);
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 13px;
  transition: left .32s cubic-bezier(.2, .8, .2, 1), bottom .32s cubic-bezier(.2, .8, .2, 1);
}
.tbtn {
  height: 32px; min-width: 32px; padding: 0 8px; border: 0; border-radius: 9px; background: transparent; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink-2); font-size: 12.5px; font-weight: 500;
  transition: background .15s, color .15s;
}
.tbtn:hover { background: var(--hover); color: var(--ink); }
.tbtn:active { background: var(--press); }
.tbtn[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.sep { width: 1px; height: 18px; background: var(--border-strong); margin: 0 4px; }
.hint {
  position: fixed; z-index: 2; right: calc(var(--inset-r) + 18px); bottom: 20px; color: var(--muted); font-size: 11.5px;
  pointer-events: none; transition: right .32s cubic-bezier(.2, .8, .2, 1), opacity .4s; text-align: right;
}
.hint b { color: var(--ink-2); font-weight: 600; }
#tooltip {
  position: fixed; left: 0; top: 0; z-index: 10; max-width: 340px; padding: 8px 11px; border-radius: 10px;
  background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; line-height: 1.45; pointer-events: none;
  opacity: 0; transition: opacity .12s; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); word-break: break-word;
}
#tooltip.show { opacity: 1; }
#tooltip .tk { font-size: 10.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; opacity: .65; display: flex; align-items: center; gap: 6px; }
#tooltip .tk i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
#tooltip .th { opacity: .6; font-size: 11px; margin-top: 3px; }
#tooltip .th:empty { display: none; }
#toast {
  position: fixed; z-index: 11; left: 50%; top: 18px; transform: translate(-50%, -12px); padding: 8px 14px; border-radius: 999px;
  background: var(--tip-bg); color: var(--tip-ink); font-size: 12.5px; font-weight: 500; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .25s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 6px 24px rgba(0, 0, 0, .22); white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- empty ---------- */
#empty { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; }
body.empty #empty { display: grid; }
body.empty #sidebar, body.empty #details, body.empty .toolbar, body.empty .hint, body.empty #sideOpen, body.empty #stage { display: none; }
.empty-card { max-width: 420px; }
.empty-orb {
  width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #c9c5f4, #7F77DD 52%, #4a43a8 100%);
  box-shadow: 0 0 0 10px rgba(127, 119, 221, .10), 0 0 0 22px rgba(127, 119, 221, .05), 0 14px 40px rgba(127, 119, 221, .35);
}
.empty-card p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ink-2); }

/* ---------- narrow screens ---------- */
@media (max-width: 860px) {
  #sidebar { top: 8px; left: 8px; bottom: 8px; width: min(320px, calc(100% - 16px)); }
  #details { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 46%; transform: translateY(calc(100% + 24px)); }
  .hint { display: none; }
  .tbtn .wide-label { display: none; }
}
body.preload * { transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0s !important; }
}
</style>
</head>

    </button>

    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><span class="wide-label">Auto-rotate</span>
  </button>

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg><span class="wide-label">Reset</span>
  </button>

<div id="tooltip" role="tooltip"><div class="tk"><i></i><span></span></div><div class="tl"></div><div class="th"></div></div>

<div id="empty"><div class="empty-card"><div class="empty-orb"></div><p>No memory yet. Work in this project with the plugin installed, then run /memory-map again.</p></div></div>

<script>
'use strict';
const DATA = /*__MEMORY_DATA__*/null;

(function memoryMap() {
  const doc = document;
  const $ = (id) => doc.getElementById(id);
  function el(tag, cls, text) {
    const e = doc.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  if (!DATA || !Array.isArray(DATA.nodes) || DATA.nodes.length === 0) {
    doc.body.classList.add('empty');
    return;
  }

  // ------------------------------------------------------------------ utilities
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOutBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
  let seed = 0x2545f491;
  function rand() {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function randDir() {
    const u = rand() * 2 - 1, th = rand() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    return { x: s * Math.cos(th), y: u, z: s * Math.sin(th) };
  }
  const oneLine = (s) => String(s).replace(/\s+/g, ' ').trim();
  const shorten = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s);
  function hexRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  function mix(hex, to, t) {
    const a = hexRgb(hex), b = hexRgb(to);
    return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',') + ')';
  }
  function rgba(hex, a) {
    const c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  const pad = (n) => String(n).padStart(2, '0');
  function fmtTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  const fmtDate = (iso) => fmtTime(iso).slice(0, 10);
  const tsOf = (iso) => { const t = Date.parse(iso || ''); return isNaN(t) ? 0 : t; };
  const fmtTokens = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n));
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

  // ------------------------------------------------------------------ kinds
  const KIND = {
    project: { color: '#888780', name: 'Project', plural: 'Project', r: 12 },
    session: { color: '#888780', name: 'Session', plural: 'Sessions', r: 8 },
    task: { color: '#7F77DD', name: 'Request', plural: 'Requests', r: 6.2 },
    command: { color: '#1D9E75', name: 'Command', plural: 'Commands', r: 4.6 },
    file: { color: '#D85A30', name: 'File', plural: 'Files', r: 5 },
    error: { color: '#E24B4A', name: 'Error', plural: 'Errors', r: 5.2 },
    decision: { color: '#BA7517', name: 'Decision', plural: 'Decisions', r: 5.8 },
  };
  const OTHER = { color: '#888780', name: 'Item', plural: 'Other', r: 4.6 };
  const kindInfo = (k) => KIND[k] || OTHER;
  const KIND_ORDER = ['session', 'task', 'decision', 'file', 'command', 'error'];
  const orderOf = (k) => { const i = KIND_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  const LABEL_KINDS = new Set(['project', 'session', 'task', 'file', 'error', 'decision', 'bundle']);
  const REL_PRIORITY = { asked: 0, edited: 1, read: 1, ran: 1, decided: 1, failed: 2 };
  const OUT_ORDER = ['asked', 'ran', 'edited', 'read', 'decided', 'failed'];
  const IN_LABEL = { asked: 'asked by', ran: 'run by', edited: 'edited by', read: 'read by', failed: 'failed in', decided: 'decided in' };
  const REST = { asked: 90, root: 125, bundle: 45 };
  const GROUP_LIMIT = 8;
  const CAP = 800;
  const RED = '#E24B4A';

  // ------------------------------------------------------------------ model
  const sessionMeta = new Map();
  for (const s of DATA.sessions || []) if (s && s.id) sessionMeta.set(String(s.id), s);
  const items = new Map();
  function makeItem(o) {
    return Object.assign({
      parent: null, parentEdge: null, children: [], groups: null, expanded: false, shown: Object.create(null),
      out: [], inc: [], x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, vis: false, born: -1e9, fixed: false, deg: 0,
      count: 1, label: '', first: '', last: '', t: 0, title: '', context: 0, search: '',
      _sx: 0, _sy: 0, _r: 0, _d: 1, _fog: 1, _on: false, _lw: null,
    }, o);
  }
  const root = makeItem({ id: '\u0000root', kind: 'project', isRoot: true, label: 'Project ' + String(DATA.project || ''), expanded: true });
  items.set(root.id, root);
  for (const n of DATA.nodes) {
    if (!n || n.id === undefined || items.has(String(n.id))) continue;
    const it = makeItem({
      id: String(n.id), kind: String(n.kind || ''), label: String(n.label === undefined || n.label === null ? '' : n.label),
      count: Math.max(1, Number(n.count) || 1), first: String(n.first || ''), last: String(n.last || ''),
    });
    it.t = tsOf(it.last) || tsOf(it.first);
    if (it.kind === 'session') {
      const m = sessionMeta.get(it.id);
      if (m) { it.title = String(m.title || ''); it.context = Number(m.context) || 0; }
    }
    it.search = (it.label + '\n' + it.title).toLowerCase();
    items.set(it.id, it);
  }
  const edges = [];
  for (const e of DATA.edges || []) {
    const s = items.get(String(e.s)), d = items.get(String(e.d));
    if (!s || !d || s === d) continue;
    const ed = { s: s, d: d, r: String(e.r || ''), c: Math.max(1, Number(e.c) || 1) };
    edges.push(ed);
    s.out.push(ed);
    d.inc.push(ed);
  }
  // The parent of a node is the source of its strongest incoming edge.
  for (const it of items.values()) {
    if (it.isRoot) continue;
    let best = null, bp = 99;
    if (it.kind !== 'session') {
      for (const e of it.inc) {
        const p = REL_PRIORITY[e.r] === undefined ? 3 : REL_PRIORITY[e.r];
        if (p < bp) { bp = p; best = e; }
      }
    }
    it.parentEdge = best;
    it.parent = best ? best.s : root;
  }
  for (const it of items.values()) { // break any cycle by hanging the node off the root
    let p = it.parent, steps = 0;
    while (p && !p.isRoot && steps++ <= items.size) {
      if (p === it) { it.parent = root; it.parentEdge = null; break; }
      p = p.parent;
    }
  }
  for (const it of items.values()) if (!it.isRoot) it.parent.children.push(it);
  const newestFirst = (a, b) => (b.t - a.t) || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0);
  for (const it of items.values()) {
    if (!it.children.length) continue;
    const g = new Map();
    for (const c of it.children) {
      if (!g.has(c.kind)) g.set(c.kind, []);
      g.get(c.kind).push(c);
    }
    it.groups = [...g.keys()].sort((a, b) => orderOf(a) - orderOf(b)).map((k) => ({ kind: k, list: g.get(k).sort(newestFirst) }));
  }
  const kindCounts = new Map();
  for (const it of items.values()) if (!it.isRoot) kindCounts.set(it.kind, (kindCounts.get(it.kind) || 0) + 1);
  const totalNodes = items.size - 1;

  // ------------------------------------------------------------------ time range
  const RANGES = [
    { id: '1h', label: '1 hour', ms: 36e5, phrase: 'hour' },
    { id: '5h', label: '5 hours', ms: 5 * 36e5, phrase: '5 hours' },
    { id: '1d', label: '1 day', ms: 864e5, phrase: 'day' },
    { id: '7d', label: '7 days', ms: 7 * 864e5, phrase: '7 days' },
    { id: 'all', label: 'All time', ms: 0, phrase: '' },
  ];
  const RANGE_KEY = 'session-memory.timeRange';
  for (const it of items.values()) it.lt = it.isRoot ? 0 : tsOf(it.last);
  const rangeCounts = new Map();
  {
    const t0 = Date.now();
    for (const r of RANGES) {
      let n = 0;
      for (const it of items.values()) if (!it.isRoot && (!r.ms || (it.lt && it.lt >= t0 - r.ms))) n++;
      rangeCounts.set(r.id, n);
    }
  }
  let range = RANGES[RANGES.length - 1];
  try {
    const saved = localStorage.getItem(RANGE_KEY);
    const found = RANGES.find((r) => r.id === saved);
    if (found) range = found;
  } catch (err) { /* storage unavailable */ }
  let rangeKindCounts = kindCounts;
  let rangeTotal = totalNodes;
  // inR: inside the range; keep: inside it, or an ancestor of something that is
  function computeRange() {
    const cutoff = range.ms ? Date.now() - range.ms : 0;
    rangeKindCounts = new Map();
    rangeTotal = 0;
    for (const it of items.values()) {
      it.inR = !it.isRoot && (!range.ms || (it.lt > 0 && it.lt >= cutoff));
      it.keep = it.inR || it.isRoot;
    }
    for (const it of items.values()) {
      if (!it.inR) continue;
      rangeTotal++;
      rangeKindCounts.set(it.kind, (rangeKindCounts.get(it.kind) || 0) + 1);
      for (let p = it.parent; p && !p.keep; p = p.parent) p.keep = true;
    }
  }
  computeRange();
  const inRangeList = (g) => (range.ms ? g.list.filter((c) => c.keep) : g.list);

  function defaultExpansion() {
    for (const it of items.values()) { it.expanded = false; it.shown = Object.create(null); }
    root.expanded = true;
    for (const c of root.children) if (c.kind === 'session') c.expanded = true;
  }
  defaultExpansion();

  const bundles = new Map();
  function bundleFor(parent, kind) {
    const key = parent.id + '\u0001' + kind;
    let b = bundles.get(key);
    if (!b) {
      b = makeItem({ id: 'bundle:' + key, kind: 'bundle', baseKind: kind, isBundle: true, parent: parent, hidden: 0 });
      bundles.set(key, b);
    }
    return b;
  }

  function shortSid(it) { return it.id.replace(/^session:/, '').slice(0, 8); }
  function nameOf(it) {
    if (it.isBundle) {
      const info = kindInfo(it.baseKind);
      return '+' + it.hidden + ' more ' + (it.hidden === 1 ? info.name : info.plural).toLowerCase();
    }
    if (it.kind === 'session') return it.title ? oneLine(it.title) : 'Session ' + shortSid(it);
    if (it.kind === 'command') return '$ ' + oneLine(it.label);
    return oneLine(it.label) || '(empty)';
  }
  function canvasLabel(it, max) {
    let s = nameOf(it);
    if (it.kind === 'file' && s.length > max) s = '…/' + s.split('/').slice(-2).join('/');
    return shorten(s, max);
  }
  const colorOf = (it) => kindInfo(it.isBundle ? it.baseKind : it.kind).color;
  function worldR(it) {
    if (it.isBundle) return KIND.task.r * 0.95;
    return kindInfo(it.kind).r * Math.min(1.9, 1 + 0.2 * Math.log(it.count));
  }
  function sessionOf(it) {
    for (let p = it; p; p = p.parent) if (p.kind === 'session') return p;
    return null;
  }

  // ------------------------------------------------------------------ visibility
  let visible = [];
  let drawn = [];
  let links = [];
  let truncated = false;
  const hiddenKinds = new Set();
  const spawnFrom = new Map();
  let initialSpawn = true;

  const isDrawn = (it) => it.vis && (it.isRoot || !hiddenKinds.has(it.isBundle ? it.baseKind : it.kind));
  function rep(it) { // nearest drawn ancestor-or-self
    let p = it;
    while (p && !isDrawn(p)) p = p.parent;
    return p || root;
  }

  function spawn(it, from, now) {
    it.born = now;
    it.fixed = false;
    if (!from) { it.x = it.y = it.z = 0; it.vx = it.vy = it.vz = 0; return; }
    const d = randDir();
    if (initialSpawn) {
      const r = (it.kind === 'session' ? REST.root : it.kind === 'task' ? REST.asked : 45) * (0.6 + rand() * 0.5);
      it.x = from.x + d.x * r; it.y = from.y + d.y * r; it.z = from.z + d.z * r;
      it.vx = it.vy = it.vz = 0;
    } else {
      it.x = from.x + d.x * 3; it.y = from.y + d.y * 3; it.z = from.z + d.z * 3;
      const v = 4 + rand() * 3;
      it.vx = d.x * v; it.vy = d.y * v; it.vz = d.z * v;
    }
  }

  function rebuild(force) {
    const before = new Set(visible);
    for (const it of visible) it.vis = false;
    visible = [];
    truncated = false;
    const now = performance.now();
    const add = (it, from) => {
      it.vis = true;
      visible.push(it);
      if (!before.has(it)) spawn(it, from, now);
    };
    add(root, null);
    for (let qi = 0; qi < visible.length; qi++) {
      const n = visible[qi];
      if (n.isBundle || !n.expanded || !n.groups) continue;
      for (const g of n.groups) {
        const lim = n.shown[g.kind] === undefined ? GROUP_LIMIT : n.shown[g.kind];
        const from = spawnFrom.get(n.id + '\u0001' + g.kind) || n;
        let hidden = 0;
        const lst = inRangeList(g);
        for (let i = 0; i < lst.length; i++) {
          const c = lst[i];
          const forced = !!(force && force.has(c));
          if ((i < lim || forced) && (visible.length < CAP || forced)) add(c, from);
          else { hidden++; if (i < lim) truncated = true; }
        }
        if (hidden > 0) {
          if (visible.length < CAP) { const b = bundleFor(n, g.kind); b.hidden = hidden; add(b, n); }
          else truncated = true;
        }
      }
    }
    spawnFrom.clear();
    initialSpawn = false;
    rebuildLinks();
    refreshMatches();
    if (truncated) toast('Showing the first ' + CAP + ' items. Collapse a part to see more.', 2600);
    updateCounts();
    if (selected && !selected.vis && selected.isBundle) clearSelection();
    if (selected) refreshDetailsToggle();
  }

  function rebuildLinks() {
    drawn = visible.filter(isDrawn);
    for (const it of drawn) it.deg = 0;
    links = [];
    const seen = new Set();
    const key = (a, b) => (a.id < b.id ? a.id + '\u0002' + b.id : b.id + '\u0002' + a.id);
    for (const it of drawn) {
      if (it.isRoot) continue;
      const a = rep(it.parent);
      const rel = it.isBundle ? 'bundle' : it.parent.isRoot || !it.parentEdge ? 'root' : it.parentEdge.r;
      const proxy = a !== it.parent;
      links.push({ a: a, b: it, rel: rel, rest: proxy ? 80 : (REST[rel] || 45), k: 0.7, tree: true, dashed: proxy });
      seen.add(key(a, it));
      a.deg++; it.deg++;
    }
    const proxies = [];
    for (const e of edges) {
      if (e === e.d.parentEdge) continue;
      const A = rep(e.s), B = rep(e.d);
      if (A === B || A.isRoot || B.isRoot) continue;
      if (A === e.s && B === e.d) {
        const k = key(A, B);
        if (seen.has(k)) continue;
        seen.add(k);
        links.push({ a: A, b: B, rel: e.r, rest: 90, k: 0.035, tree: false, dashed: false });
        A.deg++; B.deg++;
      } else proxies.push([A, B, e.r]);
    }
    let budget = 1500;
    for (const [A, B, r] of proxies) {
      const k = key(A, B);
      if (seen.has(k)) continue;
      seen.add(k);
      links.push({ a: A, b: B, rel: r, rest: 0, k: 0, tree: false, dashed: true });
      if (--budget <= 0) break;
    }
    neighborCache = null;
  }

  function expand(it) {
    if (!it.groups || it.expanded) return;
    it.expanded = true;
    rebuild();
    reheat(0.55);
  }
  function collapse(it) {
    if (!it.expanded) return;
    const stack = [it];
    while (stack.length) {
      const n = stack.pop();
      if (n !== it && n.isRoot) continue;
      n.expanded = false;
      for (const c of n.children) stack.push(c);
    }
    if (it.isRoot) it.expanded = true;
    rebuild();
    reheat(0.35);
  }
  function toggle(it) {
    if (it.expanded && !it.isRoot) collapse(it); else expand(it);
  }
  function expandBundle(b) {
    const p = b.parent;
    const g = p.groups.find((x) => x.kind === b.baseKind);
    p.shown[b.baseKind] = g ? inRangeList(g).length : Infinity;
    spawnFrom.set(p.id + '\u0001' + b.baseKind, b);
    if (selected === b) clearSelection();
    rebuild();
    reheat(0.6);
  }
  function reveal(it) {
    const path = [];
    for (let p = it; p && !p.isRoot; p = p.parent) path.unshift(p);
    for (const p of path) {
      const par = p.parent;
      par.expanded = true;
      const g = par.groups.find((x) => x.kind === p.kind);
      const idx = g ? inRangeList(g).indexOf(p) : -1;
      const lim = par.shown[p.kind] === undefined ? GROUP_LIMIT : par.shown[p.kind];
      if (idx >= lim) par.shown[p.kind] = idx + 1;
    }
    let chipsChanged = false;
    for (const p of path) if (hiddenKinds.delete(p.kind)) chipsChanged = true;
    if (chipsChanged) renderChips();
    rebuild(new Set(path));
    reheat(0.5);
  }

  // ------------------------------------------------------------------ simulation
  let alpha = 1, alphaTarget = 0;
  const CHARGE = 240, CUT2 = 1000 * 1000, VDECAY = 0.58, CENTER = 0.012, MAXV = 28, ALPHA_DECAY = 0.026, ALPHA_MIN = 0.004;
  function reheat(a) { alpha = Math.max(alpha, a); kick(); }
  function tick() {
    const n = drawn.length, A = alpha;
    for (let i = 0; i < n; i++) {
      const a = drawn[i];
      for (let j = i + 1; j < n; j++) {
        const b = drawn[j];
        let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        let d2 = dx * dx + dy * dy + dz * dz;
        if (d2 > CUT2) continue;

      if (hit && !special) continue;

  function draw(now) {

    order.sort((a, b) => b._d - a._d);

  // ------------------------------------------------------------------ picking & tooltip

  // tokens: exact usage from transcripts, measured savings vs estimated missed savings
  const TOK_COLORS = ['#6c63d4', '#1D9E75', '#D85A30', '#378ADD', '#BA7517', '#D4537E', '#888780'];
  function renderTokens() {

    function split(title, rows, nameOfRow) {
      rows = (Array.isArray(rows) ? rows : []).filter((r) => r && sumOf(r) > 0);

      const box = el('div');
      box.append(el('div', 'k', title));

      const bar = el('div', 'tok-split');

        const line = el('div', 'tok-line');
        const dot = el('span', 'dot');
        dot.style.background = TOK_COLORS[i % TOK_COLORS.length];
        line.append(dot, el('span', 'txt', nameOfRow(r)), el('span', 'meta', fmtTokens(sumOf(r)) + ' · ' + usd(r.cost, r.cost_partial)));
        line.title = nameOfRow(r) + ': ' + sumOf(r).toLocaleString() + ' tokens in ' + num(r.replies).toLocaleString() + ' replies';
        box.append(line);
      });
      wrap.append(box);
    }
    split('By model', T.models, (r) => String(r.key || '(no model)'));
    split('Who', T.who, (r) => (r.key === 'helper' ? 'Helper agents' : 'Main chat'));

    const s = (T.savings && T.savings.totals) || {};
    const box = el('div');
    box.append(el('div', 'k', 'Savings'));
    const saved = el('div', 'tok-line');
    const d1 = el('span', 'dot');
    d1.style.background = '#1D9E75';
    saved.append(d1, el('span', 'txt', 'Measured saved'), el('span', 'meta', fmtTokens(num(s.measured_saved_tokens)) + ' · ' + usd(s.measured_saved_usd)));
    saved.title = num(s.fresh_starts) + ' fresh starts: old chat context minus the new chat’s first reply, both from transcripts';
    const missed = el('div', 'tok-line');
    const d2 = el('span', 'dot');
    d2.style.background = '#D85A30';
    missed.append(d2, el('span', 'txt', 'Missed (estimate)'), el('span', 'meta', fmtTokens(num(s.missed_estimate_tokens)) + ' · ' + usd(s.missed_estimate_usd)));
    missed.title = num(s.cold_restarts) + ' cold restarts: measured cache rebuilds minus an estimated brief size';
    box.append(saved, missed);
    wrap.append(box);
    wrap.append(el('div', 'tok-note', 'Exact counts from this project’s transcripts. Dollars at prices as of ' + asOf
      + '. Cache writes without a TTL are priced as 5-minute writes. Missed savings are an estimate.'));
  }
  $('tokToggle').addEventListener('click', () => {
    const b = $('tokToggle');
    const open = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    $('tokBody').hidden = !open;
  });

  // time range picker
  function rangeNotice() {
    const none = !!range.ms && rangeTotal === 0;
    doc.body.classList.toggle('range-empty', none);
    $('rangeEmpty').textContent = none ? 'Nothing in the last ' + range.phrase + '. Try a longer range.' : '';
  }
  function renderRange() {
    const box = $('range');
    box.replaceChildren();
    for (const r of RANGES) {
      const b = el('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', r === range ? 'true' : 'false');
      b.title = r.ms ? 'Only items from the last ' + r.label.toLowerCase() : 'Show everything';
      b.append(el('span', 'lbl', r.label), el('span', 'n', String(rangeCounts.get(r.id))));
      b.addEventListener('click', () => applyRange(r));
      box.append(b);
    }
  }
  function applyRange(r) {
    range = r;
    try { localStorage.setItem(RANGE_KEY, r.id); } catch (err) { /* storage unavailable */ }
    computeRange();
    renderRange();
    renderChips();
    renderSessions();
    rebuild();
    if (selected && !selected.vis) clearSelection();
    rangeNotice();
    runSearch(searchInput.value);
    reheat(0.8);
    tween = null; tracking = null; autoFit = true;
  }

  // search
  const searchInput = $('search');
  const resultsBox = $('results');
  let searchTimer = 0;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(searchInput.value), 80);
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const first = resultsBox.querySelector('.row'); if (first) first.click(); }
  });
  $('searchClear').addEventListener('click', () => { searchInput.value = ''; runSearch(''); searchInput.focus(); });
  function runSearch(raw) {
    const q = raw.trim().toLowerCase();
    resultsBox.replaceChildren();
    if (!q) {
      sidebar.classList.remove('searching');
      $('searchInfo').textContent = '';
      matchSet = null; matchRep = null;
      kick();
      return;
    }
    sidebar.classList.add('searching');
    const hits = [];
    for (const it of items.values()) if (!it.isRoot && it.inR && it.search.includes(q)) hits.push(it);
    hits.sort(newestFirst);
    matchSet = new Set(hits);
    refreshMatches();
    $('searchInfo').textContent = hits.length ? plural(hits.length, 'match', 'matches') + (hits.length > 30 ? ' · showing 30' : '') : 'No matches';
    for (const it of hits.slice(0, 30)) {
      const b = row(it, kindInfo(it.kind).name + ' · ' + fmtDate(it.last), true);
      b.addEventListener('click', () => goTo(it));
      resultsBox.append(b);
    }
    kick();
  }

  function goTo(it) {
    if (!it.isRoot) reveal(it);
    select(it);
    autoFit = false;
    flyTo({ dist: Math.min(goal.dist, it.children.length && it.expanded ? 420 : 300) }, 520, it);
  }

  $('expandAll').addEventListener('click', () => {
    for (const it of items.values()) if (it.groups) it.expanded = true;
    rebuild();
    reheat(0.8);
    tween = null; tracking = null; autoFit = true;
  });
  $('collapseAll').addEventListener('click', () => {
    for (const it of items.values()) { it.expanded = false; it.shown = Object.create(null); }
    root.expanded = true;
    rebuild();
    reheat(0.5);
    tween = null; tracking = null; autoFit = true;
  });

  // ------------------------------------------------------------------ details panel
  const details = $('details');
  function select(it) {
    selected = it;
    neighborCache = null;
    renderDetails(it);
    const wasOpen = details.classList.contains('open');
    details.classList.add('open');
    details.setAttribute('aria-hidden', 'false');
    setTimeout(() => { if (!wasOpen) measureInsets(); ensureInView(it); }, 0);
    kick();
  }
  function ensureInView(it) {
    if (tween || !it.vis || !it._on) return;
    const m = 48;
    if (it._sx < inset.l + m || it._sx > W - inset.r - m || it._sy < m || it._sy > H - inset.b - m) flyTo({}, 480, it);
  }
  function clearSelection() {
    if (!selected && !details.classList.contains('open')) return;
    selected = null;
    neighborCache = null;
    details.classList.remove('open');
    details.setAttribute('aria-hidden', 'true');
    setTimeout(measureInsets, 0);
    kick();
  }
  $('detClose').addEventListener('click', clearSelection);
  $('detCopy').addEventListener('click', () => {
    if (!selected) return;
    copyText(selected.kind === 'session' && selected.title ? selected.title + '\n' + selected.id : selected.label);
  });
  $('detToggle').addEventListener('click', () => { if (selected) { toggle(selected); refreshDetailsToggle(); } });
  $('detFocus').addEventListener('click', () => { if (selected) { if (!selected.vis) reveal(selected); focusOn(selected); } });
  function refreshDetailsToggle() {
    const b = $('detToggle');
    const has = selected && selected.children.length && !selected.isRoot;
    b.style.display = has ? '' : 'none';
    if (has) b.textContent = selected.expanded ? 'Collapse' : 'Expand (' + selected.children.length + ')';
  }
  function copyText(text) {
    const done = () => toast('Copied');
    const fallback = () => {
      const ta = el('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      doc.body.append(ta);
      ta.select();
      try { doc.execCommand('copy'); done(); } catch (err) { toast('Could not copy'); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  function renderDetails(it) {
    const pill = $('detKind');
    pill.style.setProperty('--c', colorOf(it));
    pill.querySelector('.t').textContent = it.isRoot ? 'Project' : kindInfo(it.kind).name;
    const label = $('detLabel');
    label.className = 'det-label' + (it.kind === 'command' ? ' code' : '');
    label.textContent = it.kind === 'session' ? (it.title || 'Session ' + shortSid(it)) : it.label || '(empty)';
    const meta = $('detMeta');
    meta.replaceChildren();
    const add = (k, v) => { meta.append(el('dt', '', k), el('dd', '', v)); };
    if (it.isRoot) {
      add('Items', String(totalNodes));
      add('Links', String(edges.length));
      if (DATA.generated) add('Map made', fmtTime(DATA.generated));
    } else {
      if (it.kind === 'session') add('Session id', it.id.replace(/^session:/, ''));
      add('First seen', fmtTime(it.first));
      add('Last seen', fmtTime(it.last));
      add('Count', String(it.count));
      if (it.kind === 'session') { if (it.context) add('Context', fmtTokens(it.context) + ' tokens'); }
      else {
        const s = sessionOf(it);
        add('Session', s ? nameOf(s) : '—');
      }
    }
    refreshDetailsToggle();
    const box = $('detLinks');
    box.replaceChildren();
    const groups = new Map();
    const push = (name, other) => { if (!groups.has(name)) groups.set(name, []); groups.get(name).push(other); };
    if (it.isRoot) {
      for (const c of it.children) push('contains ' + kindInfo(c.kind).plural.toLowerCase(), c);
    } else {
      const outs = it.out.slice().sort((a, b) => OUT_ORDER.indexOf(a.r) - OUT_ORDER.indexOf(b.r));
      for (const e of outs) push(e.r, e.d);
      for (const e of it.inc) push(IN_LABEL[e.r] || e.r + ' by', e.s);
    }
    for (const [name, list] of groups) {
      list.sort(newestFirst);
      const sec = el('div');
      sec.append(el('h3', '', name + ' · ' + list.length));
      const lst = el('div', 'list');
      for (const other of list.slice(0, 40)) {
        const b = row(other, '', false);
        b.addEventListener('click', () => goTo(other));
        lst.append(b);
      }
      if (list.length > 40) lst.append(el('div', 'empty-note', 'and ' + (list.length - 40) + ' more'));
      sec.append(lst);
      box.append(sec);
    }
    $('details').querySelector('.det-body').scrollTop = 0;
  }

  // ------------------------------------------------------------------ toolbar
  $('zoomIn').addEventListener('click', () => zoomAt(center.x, center.y, 0.75));
  $('zoomOut').addEventListener('click', () => zoomAt(center.x, center.y, 1.33));
  $('fitBtn').addEventListener('click', () => fitAll());
  const rotBtn = $('rotateBtn');
  rotBtn.addEventListener('click', () => {
    autoRotate = !autoRotate;
    rotBtn.setAttribute('aria-pressed', String(autoRotate));
    kick();
  });
  $('resetBtn').addEventListener('click', () => {
    autoRotate = false;
    rotBtn.setAttribute('aria-pressed', 'false');
    vYaw = vPitch = 0;
    const yaw = DEFAULT_YAW + Math.round((goal.yaw - DEFAULT_YAW) / (Math.PI * 2)) * Math.PI * 2;
    flyTo(Object.assign(fitGoal(drawn, 80, yaw, DEFAULT_PITCH), { yaw: yaw, pitch: DEFAULT_PITCH }), 750);
  });

  // ------------------------------------------------------------------ start
  let wasNarrow = innerWidth <= 860;
  window.addEventListener('resize', () => {
    const narrow = innerWidth <= 860;
    if (narrow !== wasNarrow) { wasNarrow = narrow; doc.body.classList.toggle('side-closed', narrow); }
    resize();
    if (!interacted && !tween) { const g = fitGoal(drawn, 80); goal.tx = g.tx; goal.ty = g.ty; goal.tz = g.tz; goal.dist = g.dist; }
  });
  readTheme();
  if (innerWidth <= 860) doc.body.classList.add('side-closed');
  renderRange();
  renderChips();
  renderBrief();
  renderSessions();
  renderTokens();
  rebuild();
  rangeNotice();
  resize();
  for (let i = 0; i < 70; i++) tick();
  const first = fitGoal(drawn, 80);
  Object.assign(goal, { tx: first.tx, ty: first.ty, tz: first.tz, dist: first.dist });
  Object.assign(cam, { tx: first.tx, ty: first.ty, tz: first.tz, dist: reduced ? first.dist : first.dist * 1.9 });
  if (reduced) { cam.yaw = goal.yaw; cam.pitch = goal.pitch; }
  center.x = center.gx; center.y = center.gy;
  kick();
  requestAnimationFrame(() => requestAnimationFrame(() => doc.body.classList.remove('preload')));
})();
</script>
</body>
</html>
