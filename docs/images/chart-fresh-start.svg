<svg xmlns='http://www.w3.org/2000/svg' width='860' height='296' viewBox='0 0 860 296' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect width='860' height='296' rx='12' fill='#ffffff' stroke='#d1d9e0'/>
<text x='24' y='36' font-size='18' font-weight='600' fill='#1f2328'>Context per message: old chat vs a fresh start</text>
<text x='24' y='58' font-size='13' fill='#59636e'>Measured on 2026-11-05 when this project's own 909k-token chat was replaced by /clear</text>
<text x='148' y='114' font-size='13' text-anchor='end' fill='#59636e'>Keep old chat</text>
<rect x='160' y='92' width='500' height='34' rx='4' fill='#d1242f'/>
<text x='668' y='114' font-size='13' fill='#1f2328'>909,312</text>
<text x='148' y='166' font-size='13' text-anchor='end' fill='#59636e'>/clear + brief</text>
<rect x='160' y='144' width='40' height='34' rx='4' fill='#0969da'/>
<rect x='200' y='144' width='4' height='34' fill='#1a7f37'/>
<text x='212' y='166' font-size='13' fill='#1f2328'>75,629</text>
<rect x='160' y='204' width='12' height='12' fill='#0969da'/>
<text x='178' y='214' font-size='12' fill='#59636e'>Claude Code's own setup (instructions, tools, plugins): about 73,391, paid by every new chat</text>
<rect x='160' y='224' width='12' height='12' fill='#1a7f37'/>
<text x='178' y='234' font-size='12' fill='#59636e'>the memory brief and related notes: about 2,238</text>
<text x='24' y='272' font-size='13' fill='#1f2328'>Every message after the switch sent 833,683 fewer tokens (92% less).</text>
</svg>
