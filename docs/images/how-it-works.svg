<text x='119.0' y='169.0' font-size='12' text-anchor='middle' fill='#59636e'>files already on your disk</text>
<line x1='214' y1='155' x2='314' y2='155' stroke='#59636e' stroke-width='1.5' marker-end='url(#a)'/>
