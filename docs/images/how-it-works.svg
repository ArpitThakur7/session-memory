<text x='24' y='36' font-size='18' font-weight='600' fill='#1f2328'>How it works</text>
<text x='24' y='58' font-size='13' fill='#59636e'>Plain Python reads what Claude Code already saved; no model calls, nothing sent anywhere</text>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#59636e'/></marker></defs>
